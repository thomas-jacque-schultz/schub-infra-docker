version: "3.8"

# Volumes

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Portainer/Data
      o: bind
  code_server_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/CodeServer/Config
      o: bind
  code_server_custom_init:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/CodeServer/Config/custom-cont-init.d
      o: bind
  code_server_home:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/CodeServer/Home
      o: bind
  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Grafana/Data
      o: bind
  loki_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Loki/Config
      o: bind
  prometheus_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Prometheus/Config
      o: bind
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Prometheus/Data
      o: bind
  cloudflare_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Cloudflared/Config
      o: bind

# Secrets

secrets:
  PORTAINER_VIRTUAL_HOST:
    external: true
  PORTAINER_VIRTUAL_PORT:
    external: true
  CODE_SERVER_PASSWORD:
    external: true
  GF_SECURITY_ADMIN_USER:
    external: true
  GF_SECURITY_ADMIN_PASSWORD:
    external: true

# Log Configuration

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Services

services:
  admin-portainer:
    image: portainer/portainer-ee@sha256:18750221de87f489fffc3d52a23799e9c6a83aab0f1a5337824c81e12bf552b5
    networks:
      - schub
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - PORTAINER_VIRTUAL_HOST
      - PORTAINER_VIRTUAL_PORT
    environment:
      VIRTUAL_HOST_FILE: /run/secrets/PORTAINER_VIRTUAL_HOST
      VIRTUAL_PORT_FILE: /run/secrets/PORTAINER_VIRTUAL_PORT
    command: -H unix:///var/run/docker.sock
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  admin-code-server:
    image: lscr.io/linuxserver/code-server:4.131.0
    networks:
      - schub
    volumes:
      - code_server_config:/config
      - code_server_custom_init:/custom-cont-init.d
      - code_server_home:/home/coder
      - /home/pisel:/home/coder/project
      - /mnt/volume:/home/coder/project/projet/schub-storage/volume
      - /mnt/media:/home/coder/project/projet/schub-storage/media
      - /mnt/usb_drive:/home/coder/project/projet/schub-storage/usb_drive
      - /mnt/data:/home/coder/project/projet/schub-storage/data:ro
      - /mnt/loki/volume:/home/coder/project/projet/schub-storage/loki
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - CODE_SERVER_PASSWORD
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/Paris
      DEFAULT_WORKSPACE: /home/coder/project/projet
      FILE__PASSWORD: /run/secrets/CODE_SERVER_PASSWORD
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  monitoring-grafana:
    image: grafana/grafana:10.2.0
    networks:
      - monitoring
    volumes:
      - grafana_data:/var/lib/grafana
    secrets:
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/GF_SECURITY_ADMIN_USER
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GF_SECURITY_ADMIN_PASSWORD
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  monitoring-loki:
    image: grafana/loki:2.9.17
    networks:
      - monitoring
    volumes:
      - loki_config:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  monitoring-prometheus:
    image: prom/prometheus:v2.48.0
    networks:
      - monitoring
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  cloudflare-tunnel:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    networks:
      - monitoring
      - schub
    volumes:
      - cloudflare_config:/etc/cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true
  monitoring:
    external: true
