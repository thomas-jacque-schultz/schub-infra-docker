version: "3.8"

networks:
  schub:
    external: true
  monitoring:
    name: monitoring
    driver: overlay
    external: true

volumes:
  promtail_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Promtail/Config
      o: bind
  node_exporter_config:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/NodeExporter/CustomMetrics
      o: bind
  host_volumes:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume
      o: bind

x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

services:

  portainer-agent:
    image: portainer/agent@sha256:d63bfe57a106070fa5c0e73de0758f33aea018ed3cb6c8610c6663a4ac3a82ba
    networks:
      - schub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - host_volumes:/var/lib/docker/volumes
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

  monitoring-cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    networks:
      - monitoring
    hostname: "{{.Node.Hostname}}"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev:/dev:ro"
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

  monitoring-promtail:
    image: grafana/promtail:2.9.17
    networks:
      - monitoring
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log
      - promtail_config:/etc/promtail
    command: -config.file=/etc/promtail/docker-config.yml
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

  samba:
    image: ghcr.io/servercontainers/samba:smbd-wsdd2-a3.24.1-s4.23.8-r0
    networks:
      - schub
    volumes:
      - /mnt:/shares
      - /mnt/volume/Samba/smb.conf:/container/config/samba/smb.conf:ro
    environment:
      TZ: Europe/Paris
      SAMBA_CONF_MAP_TO_GUEST: Never
    entrypoint:
      - /bin/sh
      - -c
      - "set -a; . /shares/volume/Samba/accounts.env; set +a; exec /container/scripts/entrypoint.sh \"$$@\""
      - sh
    command: ["runsvdir", "-P", "/container/config/runit"]
    ports:
      - target: 445
        published: 445
        protocol: tcp
        mode: host
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

  monitoring-node-exporter:
    image: prom/node-exporter:v1.9.1
    networks:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - node_exporter_config:/textfile_collector:ro
    command:
      - '--collector.textfile.directory=/textfile_collector'
      - '--path.sysfs=/host/sys'
      - '--path.procfs=/host/proc'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.ipvs'
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

