version: '3.8'

# Volumes

volumes:
  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/VaultWarden/Data

# Secrets

secrets:
  VAULT_TOKEN:
    external: true

# Log Configuration

x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Services

services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    networks:
      - schub
    logging: *default-logging
    volumes:
      - vault_data:/data
    secrets:
      - VAULT_TOKEN
    environment:
      DOMAIN: "https://vault.schultz-thomas.fr"
      ADMIN_TOKEN_FILE: /run/secrets/VAULT_TOKEN
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true
