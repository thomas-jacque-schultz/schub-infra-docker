version: '3.8'

# Volumes

volumes:
  teamspeak_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Teamspeak/Data
      o: bind

# Log Configuration

x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Services

services:
  teamspeak:
    image: teamspeaksystems/teamspeak6-server@sha256:1938d31c2ed36af175049e9612f0bd2db2e492263818a5cd52683dd5482aaf99
    networks:
      - schub
    ports:
      - 9987:9987/udp   # Voice
      - 10011:10011      # ServerQuery
      - 30033:30033      # File transfer
    volumes:
      - teamspeak_data:/var/tsserver/
    environment:
      TSSERVER_LICENSE_ACCEPTED: accept
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true

