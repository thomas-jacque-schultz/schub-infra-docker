version: '3.8'

# Volumes

volumes:
  nextcloud_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/data/NextCloud_Schub
      o: bind
  nextcloud_database:
    driver: local
    driver_opts:
      type: none
      device: /mnt/volume/Nextcloud/Database
      o: bind

# Secrets

secrets:
  NEXTCLOUD_DB_PASSWORD:
    external: true
  NEXTCLOUD_DB_ROOT_PASSWORD:
    external: true

# Configs

configs:
  nextcloud_php_tuning_v1:
    file: ./php-tuning.ini

# Log Configuration

x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Nextcloud et son cron doivent partager la même configuration (Redis compris)

x-nextcloud-environment:
  &nextcloud-environment
  MYSQL_HOST: nextcloud_db
  MYSQL_DATABASE: nextcloud
  MYSQL_USER: nextcloud
  MYSQL_PASSWORD_FILE: /run/secrets/NEXTCLOUD_DB_PASSWORD
  REDIS_HOST: redis
  OVERWRITECLIURL: https://nextcloud.schultz-thomas.fr
  OVERWRITEPROTOCOL: https
  TRUSTED_PROXIES: 10.11.0.0/16
  PHP_UPLOAD_LIMIT: 100G
  PHP_MEMORY_LIMIT: 1G
  PHP_OPCACHE_MEMORY_CONSUMPTION: 256

# Services

services:
  nextcloud:
    image: nextcloud:33.0.8
    networks:
      - schub
      - nextcloud
    volumes:
      - nextcloud_data:/var/www/html
    secrets:
      - NEXTCLOUD_DB_PASSWORD
    configs:
      - source: nextcloud_php_tuning_v1
        target: /usr/local/etc/php/conf.d/zz-tuning.ini
    environment: *nextcloud-environment
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  cron:
    image: nextcloud:33.0.8
    entrypoint: /cron.sh
    networks:
      - schub
      - nextcloud
    volumes:
      - nextcloud_data:/var/www/html
    secrets:
      - NEXTCLOUD_DB_PASSWORD
    configs:
      - source: nextcloud_php_tuning_v1
        target: /usr/local/etc/php/conf.d/zz-tuning.ini
    environment: *nextcloud-environment
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  redis:
    image: redis:7.4.6-alpine
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - nextcloud
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  collabora:
    image: collabora/code:26.04.3.1.1
    networks:
      - schub
    environment:
      domain: nextcloud\.schultz-thomas\.fr
      server_name: collabora.schultz-thomas.fr
      DONT_GEN_SSL_CERT: "YES"
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:logging.level=warning
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  nextcloud_db:
    image: mariadb:12.3.3
    command: --innodb-buffer-pool-size=1G --transaction-isolation=READ-COMMITTED
    networks:
      - schub
    volumes:
      - nextcloud_database:/var/lib/mysql
    secrets:
      - NEXTCLOUD_DB_PASSWORD
      - NEXTCLOUD_DB_ROOT_PASSWORD
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/NEXTCLOUD_DB_ROOT_PASSWORD
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/NEXTCLOUD_DB_PASSWORD
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true
  nextcloud:
    driver: overlay
