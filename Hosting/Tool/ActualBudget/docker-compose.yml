# Home Assistant Stack Configuration for Docker Swarm

networks:
  schub:
    external: true

# Log Configuration
x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Container Configuration
services:
  actual:
    image: actualbudget/actual-server@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
    networks:
      - schub
    volumes:
      - actual_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:  
          - node.labels.name == dynamis


volumes:
  actual_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/ActualBudget/Data