name: schub-dev

services:
  schub-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      TZ: Europe/Paris
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
    networks:
      - schub

  connector-discord:
    build:
      context: ../../../../Schub/schub-connector-discord
      dockerfile: Dockerfile.dev
    volumes:
      # Chemin hôte réel (pas le chemin vu dans ce conteneur) : docker.sock est
      # celui de l'hôte, donc les volumes bind sont résolus par son dockerd, qui
      # ne connaît que /home/pisel/... — voir Admin/Manager/docker-compose.yml.
      - /home/pisel/projet/Schub/schub-connector-discord/src:/usr/src/app/src
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: schub-mongo
      MONGO_DB: ${MONGO_DB}
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID}
      DISCORD_ADMIN_USERNAME: ${DISCORD_ADMIN_USERNAME}
      PORTAINER_VIRTUAL_HOST: ${PORTAINER_VIRTUAL_HOST}
      PORTAINER_TOKEN: ${PORTAINER_TOKEN}
      CONNECTOR_FREEBOX_URL: http://connector-freebox:8080
      TZ: Europe/Paris
    depends_on:
      - schub-mongo
      - connector-freebox
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - schub

  connector-freebox:
    build:
      context: ../../../../Schub/schub-connector-freebox
      dockerfile: Dockerfile.dev
    volumes:
      - /home/pisel/projet/Schub/schub-connector-freebox/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      # Jeton d'appairage. Vide = connecteur en veille : il démarre, répond
      # /router/status et n'émet aucune requête vers la box.
      FREEBOX_APP_TOKEN: ${FREEBOX_APP_TOKEN:-}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:18084:8080"
    networks:
      - schub

  schub-front:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - /home/pisel/projet/Schub/schub-front-servers:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    depends_on:
      - connector-discord
    networks:
      - schub
    ports:
      - "18090:80"
    environment:
      TZ: Europe/Paris

  schub-bff:
    build:
      context: ../../../../Schub/schub-back-bff
      dockerfile: Dockerfile.dev
    volumes:
      - /home/pisel/projet/Schub/schub-back-bff/src:/usr/src/app/src
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@schub-mongo:27017/${SCHUB_MONGO_DB}?authSource=admin
      AUTH_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-key-with-at-least-32-characters}
      AUTH_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-3600}
      AUTH_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me}
      AUTH_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18090,http://localhost:5173,https://dev.schultz-thomas.fr}
      # Noms de propriétés du BFF, inchangés tant que la phase 4 ne l'a pas restructuré
      # (il devra alors distinguer le cœur du connecteur Discord).
      BOT_BASE_URL: http://connector-discord:8080
      BOT_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      TZ: Europe/Paris
    depends_on:
      schub-mongo:
        condition: service_healthy
      connector-discord:
        condition: service_started
    ports:
      - "18082:8080"
    networks:
      - schub

volumes:
  mongo_data_dev:
networks:
  schub:
    external: true
