name: schub-dev

# Volumes

volumes:
  mongo_data_dev:

# Services

services:
  dev-schub-mongo:
    image: mongo:7
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      TZ: Europe/Paris
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev-connector-discord:
    build:
      context: ../../../../Schub/schub-connector-discord
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-connector-discord/src:/usr/src/app/src
    environment:
      MONGO_HOST: dev-schub-mongo
      MONGO_DB: ${MONGO_DB}
      MONGO_USERNAME: bot
      MONGO_PASSWORD: ${MONGO_BOT_PASSWORD}
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CORE_URL: http://dev-schub-core:8080
      TZ: Europe/Paris
    depends_on:
      dev-schub-mongo:
        condition: service_healthy
      dev-schub-core:
        condition: service_healthy

  # Une seule vraie box pour le dev et la prod : le dev ne parle qu'à ce stub.
  dev-freebox-stub:
    image: node:22-alpine
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18099:8080"
    volumes:
      - /home/pisel/projet/schub-infra-docker/Hosting/Tool/CodeInfrastructure/freebox-stub:/app:ro
    environment:
      TZ: Europe/Paris
      STUB_SESSION_TTL: ${STUB_SESSION_TTL:-60}
    working_dir: /app
    command: node server.js

  dev-connector-freebox:
    build:
      context: ../../../../Schub/schub-connector-freebox
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-connector-freebox/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      FREEBOX_BASE_URL: ${FREEBOX_BASE_URL:-http://dev-freebox-stub:8080}
      FREEBOX_APP_TOKEN: ${FREEBOX_APP_TOKEN:-stub-token}
      TZ: Europe/Paris
    depends_on:
      - dev-freebox-stub

  dev-schub-core:
    build:
      context: ../../../../Schub/schub-core
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-core/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      MONGO_HOST: dev-schub-mongo
      MONGO_DB: servers
      MONGO_USERNAME: servers
      MONGO_PASSWORD: ${MONGO_SERVERS_PASSWORD}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID}
      DISCORD_ADMIN_USERNAME: ${DISCORD_ADMIN_USERNAME}
      CONNECTOR_PORTAINER_URL: http://dev-connector-portainer:8080
      CONNECTOR_FREEBOX_URL: http://dev-connector-freebox:8080
      CONNECTOR_DISCORD_URL: http://dev-connector-discord:8080
      CONNECTOR_RIOT_URL: http://dev-connector-riot:8080
      CONNECTOR_PREMADELAB_URL: http://dev-connector-premadelab:8080
      PREMADELAB_URL: https://dev.premadelab.eu
      PORT_FORWARDING_ENABLED: "true"
      PORT_FORWARDING_DRY_RUN: ${PORT_FORWARDING_DRY_RUN:-true}
      TZ: Europe/Paris
    depends_on:
      dev-schub-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  dev-connector-portainer:
    build:
      context: ../../../../Schub/schub-connector-portainer
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
      - schub
    ports:
      - "127.0.0.1:18086:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-connector-portainer/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      PORTAINER_VIRTUAL_HOST: ${PORTAINER_VIRTUAL_HOST}
      PORTAINER_TOKEN: ${PORTAINER_TOKEN}
      TZ: Europe/Paris

  dev-connector-premadelab:
    build:
      context: ../../../../Schub/schub-connector-discord-premadelab
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-connector-discord-premadelab/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      DISCORD_PREMADELAB_TOKEN: ${DISCORD_PREMADELAB_TOKEN:-}
      TZ: Europe/Paris

  dev-connector-riot:
    build:
      context: ../../../../Schub/schub-connector-riot
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-connector-riot/src:/usr/src/app/src
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      MONGO_HOST: dev-schub-mongo
      MONGO_DB: riot
      MONGO_USERNAME: riot
      MONGO_PASSWORD: ${MONGO_RIOT_PASSWORD}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_CRAWLER_SWITCHABLE: "true"
      RIOT_CRAWLER_ENABLED: "false"
      TZ: Europe/Paris
    depends_on:
      dev-schub-mongo:
        condition: service_healthy

  dev-schub-bff:
    build:
      context: ../../../../Schub/schub-back-bff
      dockerfile: Dockerfile.dev
    networks:
      - schub-dev
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - /home/pisel/projet/Schub/schub-back-bff/src:/usr/src/app/src
    environment:
      AUTH_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-key-with-at-least-32-characters}
      AUTH_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-2592000}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID}
      AUTH_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18090,http://localhost:5173,http://dev.schultz-thomas.fr,https://dev.schultz-thomas.fr,http://192.168.1.200:18090}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET}
      DISCORD_PREMADELAB_OAUTH_CLIENT_ID: ${DISCORD_PREMADELAB_OAUTH_CLIENT_ID:-}
      DISCORD_PREMADELAB_OAUTH_CLIENT_SECRET: ${DISCORD_PREMADELAB_OAUTH_CLIENT_SECRET:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-http://localhost:18090/api/auth/discord/callback}
      AUTH_FRONTS_0_KEY: schub
      AUTH_FRONTS_0_ORIGIN: https://dev.schultz-thomas.fr
      AUTH_FRONTS_0_REDIRECTURI: https://dev.schultz-thomas.fr/api/auth/discord/callback
      AUTH_FRONTS_0_POSTLOGINREDIRECT: /
      AUTH_FRONTS_1_KEY: premadelab
      AUTH_FRONTS_1_ORIGIN: https://dev.premadelab.eu
      AUTH_FRONTS_1_REDIRECTURI: https://dev.premadelab.eu/api/auth/discord/callback
      AUTH_FRONTS_1_POSTLOGINREDIRECT: /
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORE_URL: http://dev-schub-core:8080
      CONNECTOR_DISCORD_URL: http://dev-connector-discord:8080
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET:-change-me-internal-secret}
      TZ: Europe/Paris
    depends_on:
      dev-schub-core:
        condition: service_healthy
      dev-connector-discord:
        condition: service_started

  dev-schub-front:
    image: node:22-alpine
    networks:
      - schub-dev
      - schub
    ports:
      - "18090:80"
    volumes:
      - /home/pisel/projet/Schub/schub-front-servers:/app
    environment:
      API_PROXY_TARGET: http://dev-schub-bff:8080
      TZ: Europe/Paris
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    depends_on:
      - dev-schub-bff

# Networks

networks:
  schub-dev:
    driver: bridge
  schub:
    external: true
