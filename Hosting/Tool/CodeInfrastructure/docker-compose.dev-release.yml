# Se superpose à docker-compose.dev.yml : task dev:release -- vX.Y.Z

# Services

services:
  dev-connector-discord:
    image: thomasschultzschub/schub-connector-discord:${SCHUB_RELEASE:?version à rejouer, par exemple v3.1.1}
    build: !reset null
    volumes: !reset []

  dev-connector-freebox:
    image: thomasschultzschub/schub-connector-freebox:${SCHUB_RELEASE:?}
    build: !reset null
    volumes: !reset []

  dev-schub-core:
    image: thomasschultzschub/schub-core:${SCHUB_RELEASE:?}
    build: !reset null
    volumes: !reset []

  dev-connector-portainer:
    image: thomasschultzschub/schub-connector-portainer:${SCHUB_RELEASE:?}
    build: !reset null
    volumes: !reset []

  dev-connector-riot:
    image: thomasschultzschub/schub-connector-riot:${SCHUB_RELEASE:?}
    build: !reset null
    volumes: !reset []

  dev-schub-bff:
    image: thomasschultzschub/schub-bff:${SCHUB_RELEASE:?}
    build: !reset null
    volumes: !reset []

  # Sans BFF_UPSTREAM, le nginx de l'image viserait le BFF de prod sur l'overlay `schub`.
  dev-schub-front:
    image: thomasschultzschub/schub-front:${SCHUB_RELEASE:?}
    volumes: !reset []
    environment:
      BFF_UPSTREAM: dev-schub-bff:8080
    working_dir: !reset null
    command: !reset null
