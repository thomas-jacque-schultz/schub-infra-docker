version: "3"

vars:
  COMPOSE_CMD: docker compose --env-file .env.dev.example -f docker-compose.dev.yml

tasks:
  dev:
    desc: "Lance/relance l'environnement de dev (pas de rebuild, source montée en volume)"
    cmds:
      - "{{.COMPOSE_CMD}} up -d"

  dev:rebuild:
    desc: "Rebuild les images (usage - après un changement de pom.xml/package.json/Dockerfile)"
    cmds:
      - "{{.COMPOSE_CMD}} up --build -d --force-recreate"

  dev:restart:
    desc: "Redémarre un service sans rebuild. Usage: task dev:restart -- dev-connector-discord"
    cmds:
      - "{{.COMPOSE_CMD}} restart {{.CLI_ARGS}}"

  down:
    desc: "Arrête tous les conteneurs"
    cmds:
      - "{{.COMPOSE_CMD}} down"

  logs:
    desc: "Affiche les logs. Usage: task logs (tous) ou task logs -- dev-connector-discord"
    cmds:
      - "{{.COMPOSE_CMD}} logs -f {{.CLI_ARGS}}"

  clean:
    desc: "Arrête tout, supprime volumes + réseaux orphelins de cet environnement de dev"
    cmds:
      - "{{.COMPOSE_CMD}} down -v --remove-orphans"

  db:init:
    desc: "Crée un utilisateur Mongo par service sur sa base logique (idempotent)"
    cmds:
      - |
        set -a; . .env.dev.example; set +a
        # Passe par compose plutôt que par un nom de conteneur en dur : celui-ci
        # dépend du nom du projet ET du service, et a déjà changé au renommage du 13-09.
        {{.COMPOSE_CMD}} exec -T \
          -e MONGO_BOT_PASSWORD="$MONGO_BOT_PASSWORD" \
          -e MONGO_SERVERS_PASSWORD="$MONGO_SERVERS_PASSWORD" \
          -e MONGO_RIOT_PASSWORD="$MONGO_RIOT_PASSWORD" \
          dev-schub-mongo \
          mongosh "mongodb://$MONGO_ROOT_USERNAME:$MONGO_ROOT_PASSWORD@localhost:27017/admin" \
          --quiet --eval "$(cat mongo-init-databases.js)"

  db:migrate:legacy:
    desc: "ONE-SHOT : déplace discordbot.servers -> servers.servers (ancien schéma). Voir la description."
    # Le SEUL script de migration lancé à la main du système. Il enjambe deux bases, ce que
    # le cœur n'a pas le droit de faire : son utilisateur Mongo n'a de droits que sur `servers`.
    # Lui donner ce droit pour un besoin unique et définitif coûterait le cloisonnement.
    #
    # Tout le reste du schéma appartient à Mongock, dans schub-core, paquet `core.migration` :
    # appliqué au démarrage, tracé en base, jamais rejoué. Rien à lancer.
    #
    # Rejouable sans risque (repère par _id, ne supprime jamais la source).
    cmds:
      - |
        set -a; . .env.dev.example; set +a
        {{.COMPOSE_CMD}} exec -T dev-schub-mongo \
          mongosh "mongodb://$MONGO_ROOT_USERNAME:$MONGO_ROOT_PASSWORD@localhost:27017/admin" \
          --quiet --eval "$(cat mongo-migrate-servers-to-core.js)"

  # --- PROD ------------------------------------------------------------------
  #
  # Les deux tâches ci-dessus visent la stack de DEV, via docker compose. La prod est une
  # stack Swarm : ni compose, ni le même nom de conteneur. D'où ces deux jumelles.
  #
  # L'ORDRE, et pourquoi il n'y a pas d'impasse : `schub-mongo` n'a aucun depends_on, il
  # démarre seul. Les autres services planteront en boucle tant que les utilisateurs et les
  # données ne sont pas là — c'est sans gravité, `restart_policy: any` les relance et ils
  # repartent d'eux-mêmes ensuite.
  #
  #   1. déployer la stack           (mongo monte, le reste boucle)
  #   2. task db:init:prod           (crée les utilisateurs)
  #   3. task db:migrate:prod        (déplace les données de l'ancien schéma)
  #   4. les services se rattrapent tout seuls au redémarrage suivant
  #
  # Les identifiants root ne sortent jamais du conteneur : ils sont lus dans /run/secrets/,
  # là où Swarm les monte.

  db:mongo:prod:id:
    desc: "Affiche l'identifiant du conteneur Mongo de la stack Swarm"
    silent: true
    cmds:
      - |
        # Un conteneur Swarm s'appelle <stack>_schub-mongo.<slot>.<id> ; celui du dev est
        # schub-dev-dev-schub-mongo-1. Le filtre sur "_schub-mongo." ne peut donc pas attraper
        # le dev par mégarde — ce serait jouer une migration de prod sur la base de dev.
        cid=$(docker ps -q --filter "name=_schub-mongo\.")
        if [ -z "$cid" ]; then
          echo "Error: aucun conteneur Mongo de la stack Swarm trouvé. La stack est-elle déployée ?" >&2
          exit 1
        fi
        echo "$cid"

  db:init:prod:
    desc: "PROD : crée les utilisateurs Mongo. Aucun mot de passe à fournir, ils sont lus dans les secrets Swarm."
    cmds:
      - |
        set -e
        # Rien à exporter : le script lit /run/secrets/MONGO_{BOT,SERVERS}_PASSWORD depuis le
        # conteneur Mongo, qui les monte. C'est LA source de vérité — la même que celle dont
        # les services tirent leur mot de passe. Les repasser à la main rouvrirait la porte à
        # l'écart qui a fait échouer le premier déploiement du 17-09.
        cid=$(task db:mongo:prod:id)
        # La lecture des secrets se fait DANS le conteneur, par le shell : `cat()` du shell
        # mongo historique n'existe pas dans mongosh, et de toute façon les valeurs n'ont
        # aucune raison de transiter par l'extérieur.
        docker exec -i "$cid" sh -c '
          for n in MONGO_BOT_PASSWORD MONGO_SERVERS_PASSWORD MONGO_RIOT_PASSWORD; do
            [ -r "/run/secrets/$n" ] && export "$n=$(cat "/run/secrets/$n")"
          done
          mongosh --quiet --host localhost:27017 \
            --username "$(cat /run/secrets/MONGO_ROOT_USERNAME)" \
            --password "$(cat /run/secrets/MONGO_ROOT_PASSWORD)" \
            --authenticationDatabase admin --eval "$1"' _ "$(cat mongo-init-databases.js)"

  db:migrate:prod:
    desc: "PROD, ONE-SHOT : déplace discordbot.servers -> servers.servers. À jouer AVANT le premier démarrage du cœur."
    cmds:
      - |
        set -e
        cid=$(task db:mongo:prod:id)
        docker exec -i "$cid" sh -c 'mongosh --quiet --host localhost:27017 \
          --username "$(cat /run/secrets/MONGO_ROOT_USERNAME)" \
          --password "$(cat /run/secrets/MONGO_ROOT_PASSWORD)" \
          --authenticationDatabase admin --eval "$1"' _ "$(cat mongo-migrate-servers-to-core.js)"

  bootstrap:
    desc: "Environnement de dev complet : conteneurs puis bases Mongo"
    cmds:
      - task: dev
      - sleep 15
      - task: db:init
