version: "3.8"

# Volumes

volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/BotFront/Database
  # Règles de redirection permanentes, éditées à la main (port-forwarding.yml).
  # Relues au redémarrage de connector-discord.
  port_forwarding_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/PortForwarding

# Secrets

secrets:
  MONGO_ROOT_USERNAME:
    external: true
  MONGO_ROOT_PASSWORD:
    external: true
  DISCORD_TOKEN:
    external: true
  PORTAINER_TOKEN:
    external: true
  # Jeton d'appairage Freebox, obtenu via scripts/freebox-pair.sh.
  FREEBOX_APP_TOKEN:
    external: true

# Log Configuration

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Services
#
# Images poussées par release.yml (repo Schub) -> release-docker.yml de chaque
# sous-repo, sous le namespace Docker Hub thomasschultzschub. Le tag doit être
# bumpé manuellement ici à chaque release (pas encore automatisé).

services:
  schub-mongo:
    image: mongo:7
    networks:
      - schub
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/MONGO_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_ROOT_PASSWORD
      MONGO_INITDB_DATABASE: discordbot
      TZ: Europe/Paris
    secrets:
      - MONGO_ROOT_USERNAME
      - MONGO_ROOT_PASSWORD
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  connector-discord:
    image: thomasschultzschub/schub-connector-discord:v1.2.4
    networks:
      - schub
    environment:
      MONGO_DNS_NAME: schub-mongo:27017 # example mongodb://admin:change-me@schub-mongo:27017/discordbot?authSource=admin
      MONGO_DB: discordbot
      DISCORD_ADMIN_ID: 245281978054737920
      DISCORD_ADMIN_USERNAME: admin
      PORTAINER_VIRTUAL_HOST: default-value
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET}
      # Pilotage des redirections de ports : les ports des serveurs de jeu ne sont
      # ouverts que pendant qu'ils tournent. loki est le nœud où les stacks de jeu
      # sont contraintes, donc la cible des redirections.
      PORT_FORWARDING_ENABLED: "true"
      # true au premier déploiement : le connecteur lit la box et journalise ce qu'il ferait
      # sans rien modifier. À repasser à false une fois les logs vérifiés.
      PORT_FORWARDING_DRY_RUN: "true"
      PORT_FORWARDING_DEFAULT_LAN_IP: 192.168.1.202
      # Le connecteur Freebox détient le jeton et l'API du routeur ; ce service ne
      # connaît plus que son adresse.
      CONNECTOR_FREEBOX_URL: http://connector-freebox:8080
      TZ: Europe/Paris
    secrets:
      - source: MONGO_ROOT_USERNAME
      - source: MONGO_ROOT_PASSWORD
      - source: DISCORD_TOKEN
      - source: PORTAINER_TOKEN
    depends_on:
      - schub-mongo
    volumes:
      - port_forwarding_config:/etc/schub
    ports:
      - "8081:8080"
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  connector-freebox:
    image: thomasschultzschub/schub-connector-freebox:v1.2.4
    networks:
      - schub
    environment:
      SCHUB_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET}
      # Identité de l'application côté Freebox (bloc infra, à changer si la box change).
      FREEBOX_DEVICE_NAME: dynamis
      TZ: Europe/Paris
    secrets:
      - source: FREEBOX_APP_TOKEN
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          # Doit joindre mafreebox.freebox.fr sur le LAN.
          - node.labels.name == dynamis

  schub-front:
    image: thomasschultzschub/schub-front:v1.2.4
    networks:
      - schub
    depends_on:
      - connector-discord
    ports:
      - "8080:80"
    environment:
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  schub-bff:
    image: thomasschultzschub/schub-bff:v1.2.4
    networks:
      - schub
    environment:
      # Même Mongo que connector-discord, base séparée. MONGO_ROOT_USERNAME/PASSWORD sont
      # des secrets Docker (fichiers) pour schub-mongo/connector-discord, pas des variables
      # de compose — ${...} ne peut pas les lire ici. Il faut redéfinir les mêmes
      # valeurs comme variables d'environnement Portainer (Stack -> Environment
      # variables), en plus des secrets Docker déjà en place, pour que cette
      # substitution fonctionne.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@schub-mongo:27017/backend?authSource=admin
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_EXPIRATION_SECONDS: 3600
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_CORS_ALLOWED_ORIGINS: https://dev.schultz-thomas.fr
      # Noms de propriétés du BFF, inchangés tant que la phase 4 ne l'a pas restructuré
      # (il devra alors distinguer le cœur du connecteur Discord).
      BOT_BASE_URL: http://connector-discord:8080
      BOT_INTERNAL_SECRET: ${SCHUB_INTERNAL_SECRET}
      TZ: Europe/Paris
    depends_on:
      schub-mongo:
        condition: service_healthy
      connector-discord:
        condition: service_started
    ports:
      - "8082:8080"
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true
