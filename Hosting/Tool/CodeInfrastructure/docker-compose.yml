version: "3.8"

# Volumes

volumes:
  # Dossier à créer sur loki avant le déploiement (propriétaire 999) : `o: bind` refuse un chemin absent.
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/Schub/Mongo

# Secrets

secrets:
  MONGO_ROOT_USERNAME:
    external: true
  MONGO_ROOT_PASSWORD:
    external: true
  DISCORD_TOKEN:
    external: true
  PORTAINER_TOKEN:
    external: true
  # Le bot de l'application Discord PremadeLab (Schub#100) : à créer avant le déploiement.
  DISCORD_PREMADELAB_TOKEN:
    external: true
  DISCORD_PREMADELAB_OAUTH_CLIENT_SECRET:
    external: true
  MONGO_BOT_PASSWORD:
    external: true
  MONGO_SERVERS_PASSWORD:
    external: true
  MONGO_RIOT_PASSWORD:
    external: true
  RIOT_API_KEY:
    external: true
  FREEBOX_APP_TOKEN:
    external: true
  DISCORD_OAUTH_CLIENT_SECRET:
    external: true
  # Lu en fichier par configtree : en variable d'environnement, il passerait avant le fichier pour Spring.
  SCHUB_INTERNAL_SECRET:
    external: true

# Log Configuration

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

# Services

services:
  schub-mongo:
    image: mongo:7
    networks:
      - schub
    volumes:
      - mongo_data:/data/db
    secrets:
      - MONGO_ROOT_USERNAME
      - MONGO_ROOT_PASSWORD
      - MONGO_BOT_PASSWORD
      - MONGO_SERVERS_PASSWORD
      - MONGO_RIOT_PASSWORD
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/MONGO_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_ROOT_PASSWORD
      MONGO_INITDB_DATABASE: discordbot
      TZ: Europe/Paris
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Après un arrêt brutal, la récupération dépasse la minute sans ouvrir le port.
      start_period: 15m
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 10m
      placement:
        constraints:
          - node.labels.name == loki

  connector-discord:
    image: thomasschultzschub/schub-connector-discord:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: MONGO_BOT_PASSWORD
        target: MONGO_PASSWORD
      - source: DISCORD_TOKEN
    environment:
      MONGO_HOST: schub-mongo
      MONGO_DB: discordbot
      MONGO_USERNAME: bot
      CORE_URL: http://schub-core:8080
      TZ: Europe/Paris
    depends_on:
      - schub-mongo
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  schub-core:
    image: thomasschultzschub/schub-core:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: MONGO_SERVERS_PASSWORD
        target: MONGO_PASSWORD
    environment:
      MONGO_HOST: schub-mongo
      MONGO_DB: servers
      MONGO_USERNAME: servers
      DISCORD_ADMIN_ID: 227883780512153610
      DISCORD_ADMIN_USERNAME: pisel
      CONNECTOR_PORTAINER_URL: http://connector-portainer:8080
      CONNECTOR_FREEBOX_URL: http://connector-freebox:8080
      CONNECTOR_DISCORD_URL: http://connector-discord:8080
      CONNECTOR_RIOT_URL: http://connector-riot:8080
      CONNECTOR_PREMADELAB_URL: http://connector-premadelab:8080
      PORT_FORWARDING_ENABLED: "true"
      PORT_FORWARDING_DRY_RUN: "true"
      PORT_FORWARDING_DEFAULT_LAN_IP: 192.168.1.202
      TZ: Europe/Paris
    depends_on:
      - schub-mongo
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  connector-portainer:
    image: thomasschultzschub/schub-connector-portainer:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: PORTAINER_TOKEN
    environment:
      PORTAINER_VIRTUAL_HOST: http://admin-portainer:9000
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  connector-premadelab:
    image: thomasschultzschub/schub-connector-discord-premadelab:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: DISCORD_PREMADELAB_TOKEN
    environment:
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  connector-riot:
    image: thomasschultzschub/schub-connector-riot:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: MONGO_RIOT_PASSWORD
        target: MONGO_PASSWORD
      - source: RIOT_API_KEY
    environment:
      MONGO_HOST: schub-mongo
      MONGO_DB: riot
      MONGO_USERNAME: riot
      RIOT_STORAGE_ALERT_BYTES: "400000000000"
      TZ: Europe/Paris
    depends_on:
      - schub-mongo
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  connector-freebox:
    image: thomasschultzschub/schub-connector-freebox:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - source: FREEBOX_APP_TOKEN
    environment:
      FREEBOX_DEVICE_NAME: dynamis
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  schub-front:
    image: thomasschultzschub/schub-front:${SCHUB_RELEASE:?}
    networks:
      - schub
    ports:
      - "8080:80"
    environment:
      TZ: Europe/Paris
    depends_on:
      - schub-bff
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

  schub-bff:
    image: thomasschultzschub/schub-bff:${SCHUB_RELEASE:?}
    networks:
      - schub
    secrets:
      - SCHUB_INTERNAL_SECRET
      - DISCORD_OAUTH_CLIENT_SECRET
      - DISCORD_PREMADELAB_OAUTH_CLIENT_SECRET
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_EXPIRATION_SECONDS: 2592000
      DISCORD_ADMIN_ID: 227883780512153610
      AUTH_CORS_ALLOWED_ORIGINS: https://schultz-thomas.fr
      DISCORD_OAUTH_CLIENT_ID: "449160985417089024"
      # L'application Discord PremadeLab pour premadelab.eu (Schub#101) ; vide, celle de Schub.
      DISCORD_PREMADELAB_OAUTH_CLIENT_ID: ${DISCORD_PREMADELAB_OAUTH_CLIENT_ID:-}
      DISCORD_OAUTH_REDIRECT_URI: https://schultz-thomas.fr/api/auth/discord/callback
      AUTH_FRONTS_0_KEY: schub
      AUTH_FRONTS_0_ORIGIN: https://schultz-thomas.fr
      AUTH_FRONTS_0_REDIRECTURI: https://schultz-thomas.fr/api/auth/discord/callback
      AUTH_FRONTS_0_POSTLOGINREDIRECT: /
      AUTH_FRONTS_1_KEY: premadelab
      AUTH_FRONTS_1_ORIGIN: https://premadelab.eu
      AUTH_FRONTS_1_REDIRECTURI: https://premadelab.eu/api/auth/discord/callback
      AUTH_FRONTS_1_POSTLOGINREDIRECT: /
      CORE_URL: http://schub-core:8080
      CONNECTOR_DISCORD_URL: http://connector-discord:8080
      TZ: Europe/Paris
    depends_on:
      - schub-core
      - connector-discord
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

# Networks

networks:
  schub:
    external: true
