# Minecraft Cobbleverse (Cobblemon) Stack Configuration for Docker Swarm

networks:
  schub:
    external: true

# Secrets
secrets:
  MINECRAFT_RCON_PASSWORD:
    external: true
  MINECRAFT_CF_API_KEY:
    external: true

# Log Configuration
x-logging:
  &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"
    max-size: "50m"
    max-file: "3"

services:

  gaming-minecraft-cobbleverse:
    image: itzg/minecraft-server:java21
    networks:
      - schub
    ports:
      - "25900:25565"
    volumes:
      - minecraft_cobbleverse_data:/data
      - minecraft_cobbleverse_modpacks:/modpacks:ro
    secrets:
      - MINECRAFT_RCON_PASSWORD
      - MINECRAFT_CF_API_KEY
    environment:
      EULA: "TRUE"

      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/MINECRAFT_RCON_PASSWORD
      RCON_PORT: "25905"

      TYPE: AUTO_CURSEFORGE
      CF_SLUG: cobbleverse-cobblemon
      CF_MODPACK_ZIP: /modpacks/COBBLEVERSE-1.7.2-CF.zip
      CF_API_KEY_FILE: /run/secrets/MINECRAFT_CF_API_KEY
      MEMORY: "12G"

    deploy:
      resources:
        limits:
          memory: 16G
      placement:
        constraints:
          - node.labels.name == loki

volumes:
  minecraft_cobbleverse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/Minecraft/Cobbleverse
  minecraft_cobbleverse_modpacks:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/Minecraft/Cobbleverse/modpacks