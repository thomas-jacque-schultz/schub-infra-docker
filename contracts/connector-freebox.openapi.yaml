openapi: 3.1.0

info:
  title: schub-connector-freebox
  version: "1.0.0"
  description: |
    Redirections de ports du routeur.

    Ce connecteur ne sait pas *pourquoi* un port doit être ouvert : cette raison vit dans le
    cœur. Il n'expose que du vocabulaire de domaine — `PortRule`, jamais `FreeboxRedirection`.
    C'est ce qui rend le routeur remplaçable sans toucher à un appelant.

servers:
  - url: http://connector-freebox:8080
    description: overlay schub

security:
  - internalSecret: []

paths:
  /redirections:
    get:
      summary: Toutes les redirections portées par le routeur
      description: |
        Les redirections créées à la main sont incluses : elles portent un `owner` nul et ne
        doivent jamais être modifiées. C'est au cœur de faire ce tri.
      responses:
        "200":
          description: état courant du routeur
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/RouterFailure" }
    post:
      summary: Créer une redirection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortRule" }
      responses:
        "201":
          description: |
            La règle telle que le routeur l'a enregistrée. Le `providerId` n'est connu qu'ici :
            l'appelant doit le conserver pour pouvoir désigner la règle ensuite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/RouterFailure" }

  /redirections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: le `providerId` rendu par le routeur à la création
        schema: { type: string }
    put:
      summary: Mettre à jour une redirection
      description: |
        Seuls l'ouverture, le propriétaire et la cible LAN sont modifiables. Le protocole et
        les ports WAN forment l'identité de la règle : les changer, c'est en créer une autre.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortRule" }
      responses:
        "200":
          description: la règle après écriture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/RouterFailure" }
    delete:
      summary: Supprimer une redirection
      responses:
        "204": { description: supprimée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/RouterFailure" }

  /router/status:
    get:
      summary: État du lien avec le routeur
      description: |
        N'écrit rien et n'ouvre pas de session. Permet à l'appelant de se taire proprement
        quand le routeur est inutilisable, sans connaître les conditions propres à chaque marque.
      responses:
        "200":
          description: état du lien
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouterStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: |
        Secret partagé par tous les services Schub, comparé à temps constant.
        Seul `GET /actuator/health` en est dispensé.

  responses:
    Unauthorized:
      description: en-tête `X-Internal-Secret` absent ou invalide
    RouterFailure:
      description: |
        Le routeur n'a pas pu être joint ou a refusé l'opération. 502 et non 500 : la panne
        est en amont, et l'appelant doit pouvoir distinguer « le connecteur est cassé » de
        « la box ne répond pas ». Le réconciliateur du cœur repassera de lui-même.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    PortRule:
      type: object
      description: Une redirection de port, exprimée indépendamment du routeur qui la porte.
      required: [protocol, wanPortStart, wanPortEnd, lanIp, lanPort, open]
      properties:
        providerId:
          type: [string, "null"]
          description: |
            Identifiant opaque attribué par le routeur ; `null` pour une règle voulue qui
            n'existe pas encore. Le cœur ne l'interprète jamais.
        owner:
          type: [string, "null"]
          description: |
            Qui réclame cette règle (`minecraft-ftb`, `static/wireguard`). `null` désigne une
            règle créée à la main sur le routeur, observée mais jamais modifiée.
            Le connecteur l'encode dans le champ libre du routeur ; l'encodage ne franchit
            pas cette frontière.
        protocol:
          type: string
          enum: [TCP, UDP]
        wanPortStart: { type: integer, minimum: 1, maximum: 65535 }
        wanPortEnd:
          type: integer
          minimum: 1
          maximum: 65535
          description: Égal à `wanPortStart` pour un port unique.
        lanIp: { type: string, examples: ["192.168.1.202"] }
        lanPort: { type: integer, minimum: 1, maximum: 65535 }
        open:
          type: boolean
          description: État voulu (en écriture) ou observé (en lecture).

    RouterStatus:
      type: object
      required: [router, paired]
      properties:
        router:
          type: string
          description: Adresse de l'API effectivement visée.
        paired:
          type: boolean
          description: Un jeton d'appairage est configuré.
        unavailableReason:
          type: [string, "null"]
          description: Motif empêchant d'agir, ou `null` si le routeur est utilisable.
        marker:
          type: string
          description: |
            Marqueur de propriété inscrit dans le libellé des règles posées par Schub.
            Exposé pour le diagnostic uniquement — le cœur ne doit pas s'en servir.

    ProblemDetail:
      type: object
      description: RFC 9457.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
