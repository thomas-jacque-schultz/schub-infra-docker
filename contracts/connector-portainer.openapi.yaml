openapi: 3.1.0

info:
  title: schub-connector-portainer
  version: "1.0.0"
  description: |
    Stacks Portainer, et la sonde d'état qui les suit.

    Ce connecteur ne sait pas ce qu'est un serveur de jeu : il rapporte **toutes** les stacks,
    y compris celles d'infrastructure. C'est à l'appelant de trier.

    Les lectures viennent d'un cache alimenté par une sonde périodique — une seule requête
    Portainer par période, quel que soit le nombre de stacks *et* d'appelants.

servers:
  - url: http://connector-portainer:8080
    description: overlay schub

security:
  - internalSecret: []

paths:
  /stacks:
    get:
      summary: Toutes les stacks, telles que la dernière sonde les a vues
      responses:
        "200":
          description: état en cache, daté
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoStateYet" }

  /stacks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Une stack
      responses:
        "200":
          description: état en cache, daté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: aucune stack de cet identifiant dans la dernière lecture }
        "503": { $ref: "#/components/responses/NoStateYet" }

  /stacks/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Démarrer la stack
      description: |
        **202 et non 200** : Portainer bascule le statut de façon asynchrone. Au retour, la
        stack n'est pas encore en marche. Appeler `POST /stacks/refresh` plus tard — pas
        immédiatement — pour constater le nouvel état.
      responses:
        "202": { description: ordre transmis à Portainer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PortainerFailure" }

  /stacks/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Arrêter la stack
      responses:
        "202": { description: ordre transmis à Portainer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PortainerFailure" }

  /stacks/refresh:
    post:
      summary: Force une lecture immédiate
      description: |
        À appeler après avoir agi sur une stack, mais **pas dans la foulée immédiate** :
        Portainer bascule son statut de façon asynchrone, et relire aussitôt n'enregistrerait
        que l'ancien état avec une date fraîche — précisément le mensonge que `observedAt`
        existe pour empêcher.
      responses:
        "200":
          description: état après lecture
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoStateYet" }

components:
  securitySchemes:
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Secret partagé, comparé à temps constant. Seul `GET /actuator/health` en est dispensé.

  responses:
    Unauthorized:
      description: en-tête `X-Internal-Secret` absent ou invalide
    NoStateYet:
      description: |
        Aucune lecture n'a encore abouti depuis le démarrage : il n'y a aucun état à rapporter,
        pas même ancien. Une liste vide serait mensongère — elle laisserait croire que Portainer
        ne gère aucune stack.
    PortainerFailure:
      description: |
        Portainer n'a pas pu être joint ou a refusé l'opération. 502 et non 500 : la panne est
        en amont, et l'appelant doit pouvoir distinguer « le connecteur est cassé » de
        « Portainer ne répond pas ».
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    Stack:
      type: object
      required: [id, name, running, observedAt]
      properties:
        id: { type: integer }
        name: { type: string, examples: ["gaming-minecraft-ftb"] }
        endpointId:
          type: [integer, "null"]
          description: Environnement Portainer hébergeant la stack.
        running:
          type: boolean
          description: Vrai si Portainer rapportait `Status = 1` lors de la lecture.
        observedAt:
          type: string
          format: date-time
          description: |
            **Le champ le plus important de ce contrat.** Date de la lecture qui a produit
            cette valeur. Une valeur trop vieille doit être traitée comme une **absence de
            réponse**, pas comme un état : sans cela, un appelant qui démarre une stack puis
            relit aussitôt conclurait qu'elle est toujours éteinte, et refermerait ses ports.

            Une sonde en échec ne rafraîchit pas cette date : la valeur vieillit visiblement
            au lieu d'être servie comme courante.

    ProblemDetail:
      type: object
      description: RFC 9457.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
